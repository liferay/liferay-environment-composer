jobs:
    test-k3s-client-extensions:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: true
            -   uses: actions/setup-java@v4
                with:
                    distribution: zulu
                    java-version: "21"
            -   run: export BATS_FILE_EXTENSION="test.sh" && ./scripts/vendor/bats/bin/bats ./scripts/tests/test-k3s-client-extensions.test.sh
name: Test k3s Client Extensions
on:
    pull_request:
        branches: [master]