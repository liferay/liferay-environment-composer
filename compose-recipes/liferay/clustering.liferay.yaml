services:
    liferay:
        environment:
            -   LIFERAY_CLUSTER_PERIOD_LINK_PERIOD_ENABLED=true
            # Newer images only read this name. Their trial license is a developer license, which does not allow clustering.
            -   LIFERAY_CONTAINER_DISABLE_TRIAL_LICENSE=true
            -   LIFERAY_WEB_PERIOD_SERVER_PERIOD_DISPLAY_PERIOD_NODE=true
        volumes:
            -   liferay-dl:/opt/liferay/data/document_library
    liferay-cluster-node:
        depends_on:
            liferay:
                condition: service_healthy
        deploy:
            mode: replicated
            replicas: ${LIFERAY_CLUSTER_NODES}
        environment:
            -   GLOWROOT_ENABLED=${GLOWROOT_ENABLED}
            -   LIFERAY_CLUSTER_PERIOD_LINK_PERIOD_ENABLED=true
            -   LIFERAY_CONTAINER_DISABLE_TRIAL_LICENSE=true
            # Start the cluster nodes one at a time. The lock file is on the volume that every node shares, and health-check.sh releases it.
            -   LIFERAY_CONTAINER_STARTUP_LOCK_ENABLED=true
            -   LIFERAY_CONTAINER_STARTUP_LOCK_FILE=/opt/liferay/data/document_library/.liferay-startup-lock
            -   LIFERAY_CONTAINER_STATUS_ENABLED=true
            -   LIFERAY_DISABLE_TRIAL_LICENSE=true
            -   LIFERAY_DL_PERIOD_STORE_PERIOD_IMPL=${DL_STORE_CLASS}
            -   LIFERAY_WEB_PERIOD_SERVER_PERIOD_DISPLAY_PERIOD_NODE=true
        healthcheck:
            interval: 5s
            # Long enough for every cluster node to wait for its turn
            start_period: ${LIFERAY_CLUSTER_NODE_START_PERIOD}
            test: /opt/liferay/health-check.sh
            timeout: 5m
        image: ${LIFERAY_IMAGE_NAME}
        ports:
            -   "${LIFERAY_DEBUG_PORT}:8000"
            -   "${LIFERAY_PORT}:8080"
            -   "${LIFERAY_GOGO_SHELL_PORT}:11311"
        volumes:
            -   liferay-dl:/opt/liferay/data/document_library
volumes:
    liferay-dl: